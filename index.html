<script>
(function(){
const notice=document.getElementById('notice');
notice.textContent='กำลังโหลดระบบไรเดอร์…';
window.terraRiderReady=false;
for(const id of ['account','online','gps','active-tab','history-tab']) document.getElementById(id).onclick=()=>{notice.textContent='ระบบยังโหลดไม่สำเร็จ กรุณาตรวจข้อความแจ้งเตือน แล้วกดรีเฟรช';};
const fail=text=>{notice.textContent='เปิดระบบไรเดอร์ไม่สำเร็จ: '+text;};
window.addEventListener('error',e=>{if(e.message)fail(e.message);});
window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||String(e.reason)));
setTimeout(()=>{if(!window.terraRiderReady)fail('โหลดระบบนานเกินไป ตรวจการเชื่อมต่ออินเทอร์เน็ตและรีเฟรชหน้าเว็บ');},20000);
})();
</script>

let shopLocation=null;getDoc(doc(api.db,'settings','delivery')).then(s=>{shopLocation=s.data();render();}).catch(()=>{});
function current(){return jobs.find(j=>['accepted','picked_up'].includes(j.stage));}
function stopGPS(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;}
function syncGPS(){if(!gpsWanted||!current()){stopGPS();return;}if(watchId!==null)return;if(!navigator.geolocation){$('gps-state').textContent='อุปกรณ์ไม่รองรับตำแหน่ง';return;}watchId=navigator.geolocation.watchPosition(async p=>{const job=current();if(!job||sending||Date.now()-lastSent<30000)return;sending=true;try{await api.rpc('riderLocation',{orderId:job.id,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});lastSent=Date.now();$('gps-state').textContent='ส่งพิกัดล่าสุด '+new Date().toLocaleTimeString('th-TH')+' • คลาดเคลื่อนประมาณ '+Math.round(p.coords.accuracy)+' ม.';}catch(e){$('gps-state').textContent=e.message;}finally{sending=false;}},e=>{$('gps-state').textContent='ส่งตำแหน่งไม่ได้: '+e.message;stopGPS();},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
$('gps').onclick=()=>{gpsWanted=!gpsWanted;$('gps').textContent=gpsWanted?'หยุดแชร์ตำแหน่ง':'เปิดแชร์ตำแหน่ง';syncGPS();if(gpsWanted&&!current())$('gps-state').textContent='พร้อมแชร์เมื่อรับงานแล้ว';};
window.addEventListener('terra-connect-change',()=>{$('rider-name').textContent=api.profile?.name||'ยินดีต้อนรับไรเดอร์';$('online-label').textContent=!api.user?'ยังไม่ได้เข้าสู่ระบบ':!api.profile?.approved?'รอร้านอนุมัติ':api.profile?.activeOrderId?'มีงานที่ได้รับมอบหมาย':api.online?'ออนไลน์พร้อมรับงาน':'ออฟไลน์';$('online-dot').classList.toggle('on',api.online);$('online').textContent=api.online?'ปิดรับงาน':'เปิดรับงาน';if(observedUid!==api.user?.uid){unsub?.();stopGPS();observedUid=api.user?.uid||null;jobs=[];if(observedUid)unsub=api.onJobs(rows=>{jobs=rows;render();syncGPS();});render();}});
function render(){const list=jobs.filter(j=>history?['delivered','rejected'].includes(j.stage):!['delivered','rejected'].includes(j.stage)).sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0));$('active-tab').classList.toggle('selected',!history);$('history-tab').classList.toggle('selected',history);$('jobs').className='';$('jobs').innerHTML=list.length?list.map(j=>`<article class="job"><div class="row"><span class="tag">${stageLabel(j.stage)}</span><span class="muted">#${esc(j.id.slice(-6))}</span></div><h2>${esc(j.customer)}</h2><p>${esc(j.address)}</p><div class="row"><div class="muted">${j.paymentMethod==='cod'?'เก็บเงินปลายทาง':'ตรวจสอบการชำระเงินกับร้าน'}</div><div class="money">฿${Number(j.total).toFixed(2)}</div></div><details class="line"><summary>รายการอาหาร ${j.items?.length||0} รายการ</summary>${(j.items||[]).map(i=>`<p><strong>${esc(i.qty)} × ${esc(i.name)}</strong><br>${esc(i.options||'')} ${esc(i.note||'')}</p>`).join('')}</details><div class="line row">${['assigned','accepted'].includes(j.stage)&&Number.isFinite(Number(shopLocation?.lat))&&Number.isFinite(Number(shopLocation?.lng))?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${Number(shopLocation.lat)},${Number(shopLocation.lng)}">นำทางไปรับอาหารที่ร้าน ↗</a>`:''}${j.location?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${Number(j.location.lat)},${Number(j.location.lng)}">นำทางไปหาลูกค้า ↗</a>`:''}${!history?`<button class="action secondary" data-chat="${esc(j.id)}">แชตในออเดอร์</button><button class="action secondary" data-call="shop" data-id="${esc(j.id)}">โทรหาร้าน</button><button class="action secondary" data-call="customer" data-id="${esc(j.id)}">โทรหาลูกค้า</button>`:''}</div><div class="line row">${j.stage==='assigned'?`<button class="action" data-stage="accepted" data-id="${esc(j.id)}">รับงาน</button><button class="action danger" data-stage="rejected" data-id="${esc(j.id)}">ปฏิเสธงาน</button>`:j.stage==='accepted'?`<button class="action" data-stage="picked_up" data-id="${esc(j.id)}">รับอาหารแล้ว • เริ่มจัดส่ง</button>`:j.stage==='picked_up'?`<button class="action" data-stage="delivered" data-id="${esc(j.id)}">ส่งถึงลูกค้าแล้ว</button>`:`<span class="muted">${stageLabel(j.stage)}</span>`}</div></article>`).join(''):'<div class="empty">'+(history?'ยังไม่มีประวัติงาน':'ยังไม่มีงานที่ได้รับมอบหมาย')+'</div>';
 $('jobs').querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>window.terraChat(b.dataset.chat));
 $('jobs').querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>api.startCall(b.dataset.id,b.dataset.call));$('jobs').querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{const stage=b.dataset.stage,j=jobs.find(j=>j.id===b.dataset.id);if(stage==='delivered'&&!confirm(j?.paymentMethod==='cod'?'ยืนยันส่งอาหารและรับเงินปลายทางครบแล้ว?':'ยืนยันส่งอาหารถึงลูกค้าเรียบร้อยแล้ว?'))return;if(stage==='rejected'&&!confirm('ปฏิเสธงานนี้และคืนงานให้ร้าน?'))return;b.disabled=true;try{await api.rpc('riderAction',{orderId:b.dataset.id,stage});$('notice').textContent='อัปเดตสถานะให้ร้านและลูกค้าแล้ว';}catch(e){$('notice').textContent=e.message;}finally{b.disabled=false;}});
}
window.addEventListener('pagehide',stopGPS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncGPS();});
</script></body></html>
