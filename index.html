<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terra Rider • งานจัดส่ง</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f3;color:#183b2c;font:16px/1.6 system-ui,sans-serif}header{background:#073f2f;color:white;padding:32px 24px 52px}header>div,main{max-width:980px;margin:auto}header small{letter-spacing:3px;color:#a7e9c3}h1{font-size:34px;line-height:1.2;margin:12px 0}main{padding:0 20px 90px}.summary{background:white;border-radius:24px;padding:22px;margin-top:-28px;box-shadow:0 8px 25px #143c2910;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.dot{display:inline-block;width:10px;height:10px;background:#94a3b8;border-radius:50%;margin-right:8px}.dot.on{background:#10b981}.tabs{display:flex;gap:8px;margin:28px 0 18px}.tabs button{border:0;border-radius:20px;padding:9px 20px;background:white;font:inherit}.tabs button.selected{background:#143e2f;color:white}.job{background:white;border-radius:22px;padding:22px;margin:14px 0;border:1px solid #dce8df;overflow-wrap:anywhere}.tag{font-size:12px;font-weight:700;background:#dcfce7;color:#166534;border-radius:8px;padding:5px 10px}.job h2{font-size:22px;margin:14px 0 6px}.muted{color:#66796e;font-size:14px}.money{font-weight:800;font-size:23px}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.line{border-top:1px solid #edf2ee;margin-top:14px;padding-top:14px}.empty{text-align:center;padding:50px 20px;color:#62766a;border:1px dashed #b9ccbf;border-radius:20px}.action{border:0;background:#047857;color:white;padding:13px 18px;border-radius:12px;font:700 15px system-ui;cursor:pointer}.secondary{background:#e5eee8;color:#193f2d}.danger{background:#fff1f2;color:#be123c}.action:disabled{opacity:.5}a{color:#047857}#notice{white-space:pre-wrap;overflow-wrap:anywhere;color:#9f1239}#gps-state{margin:6px 0;color:#64748b;font-size:13px}button{touch-action:manipulation}
</style></head><body><header><div><small>TERRA BITE / RIDER</small><h1>ทุกงานส่งต่อด้วยความใส่ใจ</h1><p>รับอาหาร • นำทาง • ส่งถึงมือลูกค้า</p></div></header><main><section class="summary"><div><strong id="rider-name">ยินดีต้อนรับไรเดอร์</strong><div><span id="online-dot" class="dot"></span><span id="online-label">เข้าสู่ระบบเพื่อรับงาน</span></div></div><div class="row"><button id="account" class="action secondary">สมัคร / เข้าสู่ระบบ</button><button id="online" class="action">เปิดรับงาน</button></div></section><p id="notice" role="status"></p><div class="row"><p id="gps-state">แชร์ตำแหน่งเฉพาะงานที่รับแล้ว เมื่อเปิดหน้านี้ไว้</p><button id="gps" class="action secondary">เปิดแชร์ตำแหน่ง</button></div><div class="tabs"><button id="active-tab" class="selected">งานปัจจุบัน</button><button id="history-tab">ประวัติงาน</button></div><div id="jobs" class="empty">เข้าสู่ระบบ แล้วเปิดรับงานเพื่อให้ร้านมองเห็นคุณ</div></main>
<script type="module">
import {getDoc,doc} from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
import {initConnect,escapeHTML as esc,stageLabel} from './terra-connect.js';
const api=initConnect(firebaseConfig,'rider'),$=id=>document.getElementById(id);let jobs=[],history=false,unsub=null,observedUid=null,watchId=null,gpsWanted=false,lastSent=0,sending=false;
$('account').onclick=()=>api.openAccount();$('online').onclick=async()=>{try{await api.setOnline(!api.online);}catch(e){$('notice').textContent=e.message;api.openAccount();}};
$('active-tab').onclick=()=>{history=false;render();};$('history-tab').onclick=()=>{history=true;render();};
let shopLocation=null;getDoc(doc(api.db,'settings','delivery')).then(s=>{shopLocation=s.data();render();}).catch(()=>{});
function current(){return jobs.find(j=>['accepted','picked_up'].includes(j.stage));}
function stopGPS(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;}
function syncGPS(){if(!gpsWanted||!current()){stopGPS();return;}if(watchId!==null)return;if(!navigator.geolocation){$('gps-state').textContent='อุปกรณ์ไม่รองรับตำแหน่ง';return;}watchId=navigator.geolocation.watchPosition(async p=>{const job=current();if(!job||sending||Date.now()-lastSent<10000)return;sending=true;try{await api.rpc('riderLocation',{orderId:job.id,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});lastSent=Date.now();$('gps-state').textContent='ส่งพิกัดล่าสุด '+new Date().toLocaleTimeString('th-TH')+' • คลาดเคลื่อนประมาณ '+Math.round(p.coords.accuracy)+' ม.';}catch(e){$('gps-state').textContent=e.message;}finally{sending=false;}},e=>{$('gps-state').textContent='ส่งตำแหน่งไม่ได้: '+e.message;stopGPS();},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
$('gps').onclick=()=>{gpsWanted=!gpsWanted;$('gps').textContent=gpsWanted?'หยุดแชร์ตำแหน่ง':'เปิดแชร์ตำแหน่ง';syncGPS();if(gpsWanted&&!current())$('gps-state').textContent='พร้อมแชร์เมื่อรับงานแล้ว';};
window.addEventListener('terra-connect-change',()=>{$('rider-name').textContent=api.profile?.name||'ยินดีต้อนรับไรเดอร์';$('online-label').textContent=!api.user?'ยังไม่ได้เข้าสู่ระบบ':!api.profile?.approved?'รอร้านอนุมัติ':api.profile?.activeOrderId?'มีงานที่ได้รับมอบหมาย':api.online?'ออนไลน์พร้อมรับงาน':'ออฟไลน์';$('online-dot').classList.toggle('on',api.online);$('online').textContent=api.online?'ปิดรับงาน':'เปิดรับงาน';if(observedUid!==api.user?.uid){unsub?.();stopGPS();observedUid=api.user?.uid||null;jobs=[];if(observedUid)unsub=api.onJobs(rows=>{jobs=rows;render();syncGPS();});render();}});
function render(){const list=jobs.filter(j=>history?['delivered','rejected'].includes(j.stage):!['delivered','rejected'].includes(j.stage)).sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0));$('active-tab').classList.toggle('selected',!history);$('history-tab').classList.toggle('selected',history);$('jobs').className='';$('jobs').innerHTML=list.length?list.map(j=>`<article class="job"><div class="row"><span class="tag">${stageLabel(j.stage)}</span><span class="muted">#${esc(j.id.slice(-6))}</span></div><h2>${esc(j.customer)}</h2><p>${esc(j.address)}</p><div class="row"><div class="muted">${j.paymentMethod==='cod'?'เก็บเงินปลายทาง':'ตรวจสอบการชำระเงินกับร้าน'}</div><div class="money">฿${Number(j.total).toFixed(2)}</div></div><details class="line"><summary>รายการอาหาร ${j.items?.length||0} รายการ</summary>${(j.items||[]).map(i=>`<p><strong>${esc(i.qty)} × ${esc(i.name)}</strong><br>${esc(i.options||'')} ${esc(i.note||'')}</p>`).join('')}</details><div class="line row">${['assigned','accepted'].includes(j.stage)&&Number.isFinite(Number(shopLocation?.lat))&&Number.isFinite(Number(shopLocation?.lng))?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${Number(shopLocation.lat)},${Number(shopLocation.lng)}">นำทางไปรับอาหารที่ร้าน ↗</a>`:''}${j.location?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${Number(j.location.lat)},${Number(j.location.lng)}">นำทางไปหาลูกค้า ↗</a>`:''}${!history?`<button class="action secondary" data-call="shop" data-id="${esc(j.id)}">โทรหาร้าน</button><button class="action secondary" data-call="customer" data-id="${esc(j.id)}">โทรหาลูกค้า</button>`:''}</div><div class="line row">${j.stage==='assigned'?`<button class="action" data-stage="accepted" data-id="${esc(j.id)}">รับงาน</button><button class="action danger" data-stage="rejected" data-id="${esc(j.id)}">ปฏิเสธงาน</button>`:j.stage==='accepted'?`<button class="action" data-stage="picked_up" data-id="${esc(j.id)}">รับอาหารแล้ว • เริ่มจัดส่ง</button>`:j.stage==='picked_up'?`<button class="action" data-stage="delivered" data-id="${esc(j.id)}">ส่งถึงลูกค้าแล้ว</button>`:`<span class="muted">${stageLabel(j.stage)}</span>`}</div></article>`).join(''):'<div class="empty">'+(history?'ยังไม่มีประวัติงาน':'ยังไม่มีงานที่ได้รับมอบหมาย')+'</div>';
 $('jobs').querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>api.startCall(b.dataset.id,b.dataset.call));$('jobs').querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{const stage=b.dataset.stage,j=jobs.find(j=>j.id===b.dataset.id);if(stage==='delivered'&&!confirm(j?.paymentMethod==='cod'?'ยืนยันส่งอาหารและรับเงินปลายทางครบแล้ว?':'ยืนยันส่งอาหารถึงลูกค้าเรียบร้อยแล้ว?'))return;if(stage==='rejected'&&!confirm('ปฏิเสธงานนี้และคืนงานให้ร้าน?'))return;b.disabled=true;try{await api.rpc('riderAction',{orderId:b.dataset.id,stage});$('notice').textContent='อัปเดตสถานะให้ร้านและลูกค้าแล้ว';}catch(e){$('notice').textContent=e.message;}finally{b.disabled=false;}});
}
window.addEventListener('pagehide',stopGPS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncGPS();});
</script></body></html>
